name: Scheduled TfL Table Updating
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python tfl_extractor.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git add tfl.db
          git commit -m "Update TfL table"
          git push 
        
